[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-worker-sdk"
version = "0.0.11"
description = "Organizyio Forge — Python worker IPC SDK (framing, server runtime, job registry, dispatcher)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
  { name = "Organizyio", email = "opensource@organizy.io" },
]
keywords = [
  "forge",
  "ipc",
  "worker",
  "msgpack",
  "organizy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "msgpack>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/organizyio/forge"
Repository = "https://github.com/organizyio/forge"
Documentation = "https://github.com/organizyio/forge/blob/main/docs/python-worker.md"
Changelog = "https://github.com/organizyio/forge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge_worker_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
